<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="|分类 - ${site.title}|">分类</title>
    <th:block
      th:replace="~{modules/seo :: meta(
        url=${site.url + site.routes.categoriesUri},
        title=${'分类 - ' + site.title},
        description=${''},
        type='website',
        image=${site.logo})}"
    />
  </th:block>

  <body>
    <th:block
      th:fragment="content"
      th:with="cols=${(theme.config?.style?.layout_taxonomy ?: 'inherit') == 'inherit' ? (theme.config?.style?.layout_columns ?: 'three') : theme.config.style.layout_taxonomy}"
    >
      <div class="page-body">
        <div class="wrap">
          <div class="page-shell" th:attr="data-cols=${cols}">
            <aside
              class="page-aside page-aside--left"
              th:insert="~{modules/sidebar :: items(side='left', offset=0)}"
            ></aside>

            <div class="page-main">
              <header class="surface page-head">
                <h1 class="page-title">分类</h1>
                <p class="page-desc">按主题归拢的文章。</p>
              </header>

              <p class="empty surface" th:if="${#lists.isEmpty(categories)}">
                还没有分类。
              </p>

              <div class="surface" th:if="${not #lists.isEmpty(categories)}">
                <ul class="category-tree">
                  <li th:each="category : ${categories}">
                    <a th:href="@{${category.status.permalink}}">
                      <span th:text="${category.spec.displayName}"></span>
                      <span
                        class="category-tree__count"
                        th:text="${category.postCount}"
                      ></span>
                    </a>
                    <th:block th:if="${not #lists.isEmpty(category.children)}">
                      <th:block
                        th:replace="~{modules/category-tree :: tree(categories=${category.children})}"
                      ></th:block>
                    </th:block>
                  </li>
                </ul>
              </div>
            </div>

            <aside
              class="page-aside page-aside--right"
              th:insert="~{modules/sidebar :: items(side='right', offset=0)}"
            ></aside>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
