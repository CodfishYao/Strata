<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
  th:fragment="html (head, content)"
  th:attr="data-scheme-default=${theme.config?.style?.color_scheme ?: 'system'},
           data-font=${theme.config?.font?.font_family ?: 'inter'},
           data-code-font=${theme.config?.font?.code_font ?: 'jetbrains'},
           data-nav-anim=${theme.config?.style?.mobile_nav_animation ?: 'slide'},
           data-perf=${(theme.config?.perf?.enable_content_visibility ?: true) ? 'cv' : null},
           data-light-bg=${theme.config?.style?.light_bg ?: 'paper'},
           data-cover-mode=${theme.config?.list?.cover_fit_mode ?: 'auto'},
           data-lightbox-anim=${(theme.config?.style?.lightbox_animation ?: true) ? 'on' : 'off'},
           data-avif=${((theme.config?.perf?.enable_avif ?: false) or (theme.config?.list?.cover_avif ?: false)) ? 'on' : null},
           data-avif-scope=${(theme.config?.perf?.enable_avif ?: false) ? 'all' : 'cover'},
           data-avif-mode=${theme.config?.perf?.avif_mode ?: 'lazy'}"
  th:style="|--accent:${(theme.config?.style?.accent_reset ?: false) ? '#2f6feb' : (theme.config?.style?.accent_color ?: '#2f6feb')};--fs-body:${theme.config?.font?.body_font_size ?: 17}px;--lh-body:${theme.config?.font?.body_line_height ?: 1.85};--tint-strength:${theme.config?.style?.light_bg_tint ?: 6}%;--card-dim:${theme.config?.style?.light_card_dim ?: 0}%;--soften:${theme.config?.style?.light_soften ?: 5}%;--lb-dur:${theme.config?.style?.lightbox_speed ?: 220}ms;--switch-dur:${theme.config?.style?.theme_switch_speed ?: 420}ms|"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:if="${head == null}" th:text="${site.title}">Strata</title>
    <link
      rel="icon"
      th:if="${not #strings.isEmpty(site.favicon)}"
      th:href="${site.favicon}"
    />

    <style th:if="${not #strings.isEmpty(theme.config?.font?.font_url)}" th:inline="css">
      @font-face {
        font-family: "StrataCustom";
        src: url("/*[[${theme.config.font.font_url}]]*/") format("woff2");
        font-display: swap;
      }
    </style>
    <th:block th:if="${theme.config?.perf?.enable_preconnect ?: true}">
      <link rel="preconnect" href="https://api.iconify.design" crossorigin />
      <link rel="dns-prefetch" href="https://api.iconify.design" />
    </th:block>

    <!-- 配色三档：优先本地记忆，其次主题设置，最后跟随系统。必须在样式计算前执行，避免闪烁。 -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var saved = null;
        try {
          saved = localStorage.getItem("strata-scheme");
        } catch (e) {}
        var pref = saved || root.getAttribute("data-scheme-default") || "system";
        if (pref !== "light" && pref !== "dark" && pref !== "system") {
          pref = "system";
        }
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-scheme", pref);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.classList.toggle("dark", dark);
        root.classList.toggle("light", !dark);
      })();
    </script>

    <script th:inline="javascript">
      window.__STRATA__ = {
        tocDepth: /*[[${theme.config?.post?.toc_depth ?: 3}]]*/ 3,
        spotlight: /*[[${theme.config?.style?.card_spotlight ?: true}]]*/ true,
        switchAnim: /*[[${theme.config?.style?.theme_switch_anim ?: 'circle'}]]*/ "circle",
        perf: {
          prefetch: /*[[${theme.config?.perf?.enable_prefetch ?: true}]]*/ true,
          lazyImages: /*[[${theme.config?.perf?.enable_lazy_images ?: true}]]*/ true,
        },
        nightDim: {
          enabled: /*[[${theme.config?.style?.night_dim ?: false}]]*/ false,
          start: /*[[${theme.config?.style?.night_start ?: 20}]]*/ 20,
          end: /*[[${theme.config?.style?.night_end ?: 6}]]*/ 6,
        },
        labels: {
          loading: /*[[#{common.loading}]]*/ "加载中…",
          end: /*[[#{common.end}]]*/ "已经到底了",
          copy: /*[[#{common.copy}]]*/ "复制",
          copied: /*[[#{common.copied}]]*/ "已复制",
          copyFailed: /*[[#{common.copyFailed}]]*/ "复制失败",
        },
        external: {
          enabled: /*[[${theme.config?.external?.external_enabled ?: true}]]*/ true,
          newWindow: /*[[${theme.config?.external?.external_new_window ?: true}]]*/ true,
          message: /*[[${theme.config?.external?.external_message ?: ''}]]*/ "",
          delay: /*[[${theme.config?.external?.external_delay ?: 0}]]*/ 0,
          whitelist: /*[[${theme.config?.external?.external_whitelist ?: ''}]]*/ "",
        },
      };
    </script>

    <script type="module" src="./js/main.ts"></script>
    <script type="module" src="./js/post.ts"></script>

    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>
    <!-- 自定义 head 代码（主题设置） -->
    <th:block th:if="${not #strings.isEmpty(theme.config?.seo?.custom_head)}">
      <th:block th:utext="${theme.config.seo.custom_head}" />
    </th:block>
  </head>

  <body>
    <th:block
      th:with="bgEffect=${theme.config?.style?.bg_effect ?: ((theme.config?.style?.starlight ?: false) ? 'stars' : 'none')}"
    >
      <canvas
        th:if="${bgEffect != 'none'}"
        class="starfield"
        th:attr="data-bg-effect=${bgEffect}"
        aria-hidden="true"
      ></canvas>
    </th:block>

    <a class="skip-link" href="#main" th:text="#{common.skip}">跳到正文</a>

    <header class="site-head" data-site-head>
      <div class="wrap site-head__inner">
        <a
          class="brand"
          th:href="@{/}"
          th:with="brandLogo=${#strings.isEmpty(site.logo)
            ? ''
            : (#strings.contains(site.logo, '/upload/') and not #strings.contains(site.logo, 'width=')
              ? site.logo + (#strings.contains(site.logo, '?') ? '&width=64' : '?width=64')
              : site.logo)}"
        >
          <img
            th:if="${not #strings.isEmpty(brandLogo)}"
            th:src="${brandLogo}"
            th:alt="${site.title}"
            width="26"
            height="26"
            decoding="async"
          />
          <span th:text="${site.title}">站点标题</span>
        </a>

        <nav class="site-nav" th:with="primaryMenu = ${menuFinder.getPrimary()}">
          <ul th:if="${primaryMenu != null}">
            <th:block
              th:replace="~{modules/menu-tree :: items(menuItems=${primaryMenu.menuItems})}"
            />
          </ul>
        </nav>

        <div class="head-actions">
          <th:block th:if="${theme.config?.header?.socials != null}">
            <a
              th:each="s : ${theme.config.header.socials}"
              th:if="${not #strings.isEmpty(s.icon)}"
              class="icon-btn social-btn"
              th:href="${s.url ?: '#'}"
              th:attr="aria-label=${s.label ?: '社交链接'},
                       title=${s.label ?: ''},
                       target=${#strings.startsWith(s.url ?: '', 'http')} ? '_blank' : null,
                       rel=${#strings.startsWith(s.url ?: '', 'http')} ? 'noopener noreferrer' : null"
            >
              <span
                class="social-btn__icon"
                th:with="iconUrl=${#strings.startsWith(s.icon, 'http') or #strings.startsWith(s.icon, 'data:') or #strings.startsWith(s.icon, '<svg') ? s.icon : 'https://api.iconify.design/' + #strings.replace(s.icon, ':', '/') + '.svg'}"
                th:style="|--ink-icon:url('${iconUrl}')|"
              ></span>
            </a>
          </th:block>

          <button
            th:if="${(theme.config?.header?.search_enabled ?: true) and pluginFinder.available('PluginSearchWidget')}"
            class="search-btn"
            type="button"
            data-search-open
            aria-label="搜索"
            title="搜索"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <span class="search-btn__text" th:text="#{common.search}">搜索</span>
          </button>

          <button
            class="icon-btn scheme-toggle"
            type="button"
            data-scheme-toggle
            aria-label="切换配色：浅色 / 深色 / 跟随系统"
            title="切换配色"
          >
            <svg data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg data-icon="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="4" width="19" height="13" rx="2" />
              <path d="M8.5 21h7M12 17v4" />
            </svg>
          </button>

          <button
            class="icon-btn nav-toggle"
            type="button"
            data-nav-toggle
            aria-label="展开导航"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="load-bar" data-loadbar hidden aria-hidden="true"></div>

    <main class="site-main" id="main">
      <th:block th:replace="${content}" />
    </main>

    <th:block th:with="cfg=${theme.config?.footer}">
      <footer class="site-foot">
        <div class="wrap site-foot__inner">
          <p class="site-foot__meta">
            <span
              th:if="${cfg?.show_copyright ?: true}"
              th:text="${#strings.isEmpty(cfg?.copyright_text) ? '© ' + #temporals.year(#temporals.createNow()) + ' ' + site.title : cfg.copyright_text}"
            ></span>
            <span
              th:if="${not #strings.isEmpty(cfg?.footer_text)}"
              th:text="| · ${cfg.footer_text}|"
            ></span>
          </p>

          <p class="site-foot__links">
            <a th:if="${cfg?.show_rss ?: true}" th:href="@{/rss.xml}" rel="alternate">RSS</a>
            <a th:if="${cfg?.show_sitemap ?: true}" th:href="@{/sitemap.xml}">Sitemap</a>
            <a
              th:if="${(cfg?.show_icp ?: true) and not #strings.isEmpty(cfg?.icp)}"
              href="https://beian.miit.gov.cn/"
              target="_blank"
              rel="noopener noreferrer"
              th:text="${cfg.icp}"
            ></a>
            <!-- 公安联网备案：按《计算机信息网络国际联网安全保护管理办法》要求，
                 在首页底部展示备案编号并链接到公安备案系统 -->
            <a
              class="site-foot__police"
              th:if="${(cfg?.show_police ?: false) and not #strings.isEmpty(cfg?.police_record)}"
              th:href="${not #strings.isEmpty(cfg?.police_record_url)
                ? cfg.police_record_url
                : 'https://beian.mps.gov.cn/'}"
              target="_blank"
              rel="noopener noreferrer"
              th:aria-label="|公安备案 ${cfg.police_record}，前往公安备案系统查询|"
            >
              <span class="site-foot__police-ico" th:style="|--ink-icon:url('https://api.iconify.design/ri/shield-check-line.svg')|" aria-hidden="true"></span>
              <span th:text="${cfg.police_record}"></span>
            </a>
            <span th:if="${cfg?.show_powered ?: true}" class="site-foot__powered">
              Powered by
              <a href="https://halo.run" target="_blank" rel="noopener noreferrer">Halo</a>
              ·
              <a th:href="@{/}" th:text="|${theme.spec.displayName}|">Strata</a>
            </span>
          </p>
        </div>
      </footer>
    </th:block>

    <!-- 外链跳转提示 -->
    <div class="ink-modal" data-ext-modal hidden>
      <div class="ink-modal__backdrop" data-ext-cancel></div>
      <div class="ink-modal__panel" role="dialog" aria-modal="true" aria-labelledby="ext-title">
        <h2 class="ink-modal__title" id="ext-title">外部链接</h2>
        <p class="ink-modal__text" data-ext-message></p>
        <p class="ink-modal__url" data-ext-url></p>
        <p class="ink-modal__hint" data-ext-hint hidden></p>
        <div class="ink-modal__actions">
          <button class="btn" type="button" data-ext-cancel>取消</button>
          <a class="btn btn--primary" data-ext-go href="#" rel="noopener noreferrer">继续访问</a>
        </div>
      </div>
    </div>

    <!-- 图片放大 -->
    <button class="ink-lightbox" data-lightbox hidden type="button" th:aria-label="#{common.closePreview}">
      <img data-lightbox-img alt="" />
    </button>

    <button type="button" class="to-top" data-to-top th:aria-label="#{common.toTop}" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>
    <halo:footer />
    <!-- 自定义页脚代码（主题设置） -->
    <th:block th:if="${not #strings.isEmpty(theme.config?.seo?.custom_footer)}">
      <th:block th:utext="${theme.config.seo.custom_footer}" />
    </th:block>
  </body>
</html>
