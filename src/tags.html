<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="|标签 - ${site.title}|">标签</title>
    <th:block
      th:replace="~{modules/seo :: meta(
        url=${site.url + site.routes.tagsUri},
        title=${'标签 - ' + site.title},
        description=${''},
        type='website',
        image=${site.logo})}"
    />
  </th:block>

  <body>
    <th:block
      th:fragment="content"
      th:with="cols=${(theme.config?.style?.layout_taxonomy ?: 'inherit') == 'inherit' ? (theme.config?.style?.layout_columns ?: 'three') : theme.config.style.layout_taxonomy}"
    >
      <div class="page-body">
        <div class="wrap">
          <div class="page-shell" th:attr="data-cols=${cols}">
            <aside
              class="page-aside page-aside--left"
              th:insert="~{modules/sidebar :: items(side='left', offset=0)}"
            ></aside>

            <div class="page-main">
              <header class="surface page-head">
                <h1 class="page-title">标签</h1>
                <p class="page-desc">按关键词浏览文章。</p>
              </header>

              <p class="empty surface" th:if="${#lists.isEmpty(tags)}">还没有标签。</p>

              <div class="surface" th:if="${not #lists.isEmpty(tags)}">
                <ul class="tag-cloud">
                  <li th:each="tag : ${tags}" th:if="${tag.postCount > 0}">
                    <a class="tag-chip" th:href="@{${tag.status.permalink}}">
                      <span th:text="${tag.spec.displayName}"></span>
                      <span th:text="${tag.postCount}"></span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>

            <aside
              class="page-aside page-aside--right"
              th:insert="~{modules/sidebar :: items(side='right', offset=0)}"
            ></aside>
          </div>
        </div>
      </div>
    </th:block>
  </body>
</html>
