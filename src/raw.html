<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
  <th:block th:fragment="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">页面</title>
    <th:block
      th:replace="~{modules/seo :: meta(
        url=${site.url + singlePage.status.permalink},
        title=${singlePage.spec.title},
        description=${singlePage.status.excerpt},
        type='article',
        image=${site.logo})}"
    />

  </th:block>

  <body>
    <th:block th:fragment="content">
      <!-- 空白页面：不套卡片、不加标题，页面正文 HTML 原样输出 -->
      <div class="page-body">
        <div class="wrap">
          <div class="raw-page" th:classappend="${#annotations.contains(singlePage, 'blocks')} ? ' raw-page--with-blocks'" th:utext="${singlePage.content.content}"></div>
          <th:block
            th:replace="~{modules/page-blocks :: render(
              blocks=${#annotations.contains(singlePage, 'blocks') ? #annotations.get(singlePage, 'blocks') : ''})}"
          />
        </div>
      </div>
    </th:block>
  </body>
</html>
